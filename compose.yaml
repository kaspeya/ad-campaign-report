services:
  app:
    build: .
    image: ad-report
    environment:
      - GIGACHAT_AUTH_KEY
      - GIGACHAT_MODEL
      - GIGACHAT_SCOPE
      - GIGACHAT_BASE_URL
      - GIGACHAT_VERIFY_SSL
      - GIGACHAT_CA_BUNDLE
    volumes:
      - ./respondents.csv:/data/respondents.csv:ro
      - ./views.csv:/data/views.csv:ro
      - ./output:/app/output
